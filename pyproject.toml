[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base-agent"
version = "0.1.0"
description = "A streamlined local agent with PyQt6 GUI, OpenAI-compatible LLM, and pluggable tools."
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "mcp>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# RAG / knowledge base support: vector store + embedding + reranker + parsers
rag = [
    "lancedb>=0.17.0",
    "fastembed>=0.4.0",
    "FlagEmbedding>=1.3.0",
    "transformers>=4.40,<5.0",  # FlagEmbedding 不兼容 transformers 5.x
    "python-docx>=1.0.0",
    "openpyxl>=3.0.0",
    "python-pptx>=0.6.0",
    "PyMuPDF>=1.23.0",
    "ebooklib>=0.18",
]
# PDF OCR (optional, heavy dependency ~500MB)
ocr = ["rapidocr-onnxruntime>=1.0.0"]
# All optional features
all = ["base-agent[test,rag,ocr]"]

[project.scripts]
base-agent = "agent.ui.main_window:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
