[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "base-agent"
version = "0.1.0"
description = "A streamlined local agent with PyQt6 GUI, OpenAI-compatible LLM, and pluggable tools."
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# pytest-qt 提供 `qapp` / `qtbot` fixture —— tests/test_bridge.py 与
# tests/test_integration.py 依赖它构造 MainWindow；缺了这两个文件的用例
# 会全部在 setup 阶段报 "fixture 'qapp' not found"。
test = ["pytest>=8.0", "pytest-qt>=4.0"]
# RAG / knowledge base support: vector store + embedding + reranker + parsers
rag = [
    # lancedb 0.26+ 不再提供 macOS x86_64 (Intel) 的 wheel（仅 ARM64），
    # 故锁定 <0.26。代码已兼容 0.25 与 0.37 两种 FTS API（见 vector_store.py
    # _ensure_fts_index），在 ARM64 机器上可放宽至 0.37。
    "lancedb>=0.17.0,<0.26",
    "pyarrow>=15.0.0",
    "numpy>=1.24.0",
    # fastembed 0.6 起提供 TextCrossEncoder（ONNX 重排序），取代
    # FlagEmbedding（省掉 ~2GB 的 PyTorch 依赖链）；重排序模型改用
    # 官方 INT8 量化版 bge-reranker-v2-m3-int8（~570MB）。
    "fastembed>=0.6.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.0.0",
    "python-pptx>=0.6.0",
    "PyMuPDF>=1.23.0",
    # 文本型 PDF → Markdown：保留标题/列表/表格结构的精确转换（OCR 测试窗口
    # 对文本型页优先使用）；缺失时回退 PyMuPDF 原生 get_text，不影响其它功能。
    "pymupdf4llm>=0.0.14",
    "ebooklib>=0.18",
    "chonkie[semantic]>=1.0.0",
    # 语义切片快路径：model2vec 静态嵌入（potion-base-32M）驱动 chonkie 的
    # 切片决策，纯 numpy 推理，比共享 nomic 适配器快约两个数量级（#118）。
    # 缺失时自动回退 nomic 适配器（慢但正确）。
    "model2vec>=0.3",
    "docling>=2.0.0",
    # docling OCR 首选引擎：Apple Vision 框架（macOS 原生，系统级加速）。
    # docling 的 auto 探测 ocrmac 优先、rapidocr 回退；不可用时静默跳过。
    "ocrmac>=1.0.1",
    # BM25 hybrid retrieval: 原生 FTS (simple tokenizer) + jieba CJK 预分词
    "jieba>=0.42",
    # onnxruntime 版本下限由 fastembed / rapidocr 的稳定性决定（不再为 CoreML
    # EP 而强制：RapidOCR 已改回默认 CPU EP，见 parsers._get_ocr_engine）。
    "onnxruntime>=1.31",
    # 直接 ONNX Embedding/Reranker 使用本地 tokenizer.json，禁止联网加载。
    "transformers>=4.49",
]
# PDF OCR (optional, heavy dependency ~500MB)。
# rapidocr 3.x 起为统一包名（兼容层 rapidocr-onnxruntime 仅供旧环境回退，
# 见 parsers._get_ocr_engine）；模型目录与 docling 共享，一律走默认 CPU EP。
ocr = ["rapidocr>=3.10"]
# marker-pdf：与 docling 并行的 PDF→Markdown 引擎（#134），经
# rag_pdf_engine 配置切换。会连带拉 PyTorch（~2GB+）+ surya OCR 模型，
# 故独立 extra，不进默认 rag 组；未安装时自动回退 docling。
marker = ["marker-pdf>=2.0.0"]
# 应用内直接加载本地模型。MLX 仅在 Apple Silicon macOS 可用；ONNX 与
# llama.cpp 保持独立 extra，用户只需安装实际选择的运行时。
local-mlx = [
    "mlx>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.7.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-embeddings>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers>=4.49",
]
local-onnx = ["numpy>=1.24.0", "onnxruntime>=1.31", "transformers>=4.49"]
local-gguf = ["llama-cpp-python>=0.3.36"]
# All optional features
#all = ["base-agent[test,rag,ocr]"]

[project.scripts]
base-agent = "agent.ui.main_window:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
